name: e2e

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: chronos
          POSTGRES_PASSWORD: chronos
          POSTGRES_DB: chronos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chronos -d chronos"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      CHRONOS_DB_URL: jdbc:postgresql://localhost:5432/chronos
      CHRONOS_DB_USER: chronos
      CHRONOS_DB_PASSWORD: chronos
      CHRONOS_JWT_SECRET: ci-stable-secret
      CHRONOS_CORS_ORIGIN: http://localhost:3000
      # No AGENT_KEY in CI — the API falls back to Ollama, which isn't
      # running, so the assistant returns the friendly "not configured"
      # error. The assistant.spec.ts asserts on the response shape, not
      # on a real Gemini reply.
    steps:
      - uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build the API jar
        working-directory: services/api
        run: ./mvnw -B -q -DskipTests package

      - name: Start the API
        working-directory: services/api
        run: |
          nohup java -jar target/*.jar > ../../api.log 2>&1 &
          echo $! > ../../api.pid

      - name: Wait for API health
        run: |
          for i in $(seq 1 60); do
            if curl -sSf http://localhost:8080/actuator/health | grep -q '"UP"'; then
              echo "API up"
              exit 0
            fi
            sleep 2
          done
          echo "API failed to start"
          tail -200 api.log
          exit 1

      - name: Install frontend deps
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Build the frontend
        working-directory: frontend
        env:
          CHRONOS_API_URL: http://localhost:8080
          NEXT_PUBLIC_CHRONOS_API_URL: http://localhost:8080
        run: npm run build

      - name: Start the frontend
        working-directory: frontend
        env:
          CHRONOS_API_URL: http://localhost:8080
          NEXT_PUBLIC_CHRONOS_API_URL: http://localhost:8080
          NODE_ENV: production
        run: |
          nohup npm run start > ../frontend.log 2>&1 &
          echo $! > ../frontend.pid

      - name: Wait for frontend
        run: |
          for i in $(seq 1 30); do
            if curl -sSf -o /dev/null http://localhost:3000/login; then
              echo "frontend up"
              exit 0
            fi
            sleep 2
          done
          echo "frontend failed to start"
          tail -200 frontend.log
          exit 1

      - name: Run Playwright
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:3000
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Tail logs on failure
        if: failure()
        run: |
          echo "===== api.log ====="
          tail -200 api.log || true
          echo "===== frontend.log ====="
          tail -200 frontend.log || true

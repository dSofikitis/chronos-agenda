spring:
  application:
    name: chronos-api
  config:
    # Source AGENT_MODE / AGENT_KEY (and friends) from a top-level .env at
    # project root if it exists. `optional:` keeps startup quiet when the
    # file is absent; production deploys set env vars directly.
    import:
      - "optional:file:./.env[.properties]"
      - "optional:file:../../.env[.properties]"
  datasource:
    url: ${CHRONOS_DB_URL:jdbc:postgresql://localhost:5432/chronos}
    username: ${CHRONOS_DB_USER:chronos}
    password: ${CHRONOS_DB_PASSWORD:chronos}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    com.dsofikitis.chronos: DEBUG
    org.springframework.security: INFO

chronos:
  jwt:
    secret: ${CHRONOS_JWT_SECRET:}
    ttl: ${CHRONOS_JWT_TTL:PT24H}
    cookie-name: chronos_session
    cookie-secure: ${CHRONOS_COOKIE_SECURE:false}
  cors:
    origin: ${CHRONOS_CORS_ORIGIN:http://localhost:3000}
  oauth:
    success-redirect: ${CHRONOS_OAUTH_SUCCESS_REDIRECT:http://localhost:3000/agenda}
    failure-redirect: ${CHRONOS_OAUTH_FAILURE_REDIRECT:http://localhost:3000/login?error=oauth}
    # Toggle separately from GOOGLE_CLIENT_ID so the autoconfig validator
    # doesn't run on an empty-string registration during local-dev startup.
    # Set to true alongside GOOGLE_CLIENT_ID + GOOGLE_CLIENT_SECRET to
    # activate the Google OAuth2 chain.
    enabled: ${CHRONOS_OAUTH_ENABLED:false}
  llm:
    # Unified config: AGENT_MODE selects the backend (claude | gemini),
    # AGENT_KEY is the credential. Empty / unrecognized → Ollama fallback.
    agent:
      mode: ${AGENT_MODE:}
      key: ${AGENT_KEY:}
    anthropic:
      model: ${CHRONOS_CLAUDE_MODEL:claude-opus-4-7}
      base-url: https://api.anthropic.com
      max-tokens: 1024
    gemini:
      model: ${CHRONOS_GEMINI_MODEL:gemini-2.5-flash}
      base-url: https://generativelanguage.googleapis.com
    ollama:
      base-url: ${CHRONOS_OLLAMA_URL:http://localhost:11434}
      model: ${CHRONOS_OLLAMA_MODEL:qwen2.5:3b}
    history-window: 12

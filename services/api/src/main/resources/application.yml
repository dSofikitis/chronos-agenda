spring:
  application:
    name: chronos-api
  datasource:
    url: ${CHRONOS_DB_URL:jdbc:postgresql://localhost:5432/chronos}
    username: ${CHRONOS_DB_USER:chronos}
    password: ${CHRONOS_DB_PASSWORD:chronos}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope:
              - openid
              - email
              - profile

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    com.dsofikitis.chronos: DEBUG
    org.springframework.security: INFO

chronos:
  jwt:
    secret: ${CHRONOS_JWT_SECRET:}
    ttl: ${CHRONOS_JWT_TTL:PT24H}
    cookie-name: chronos_session
    cookie-secure: ${CHRONOS_COOKIE_SECURE:false}
  cors:
    origin: ${CHRONOS_CORS_ORIGIN:http://localhost:3000}
  oauth:
    success-redirect: ${CHRONOS_OAUTH_SUCCESS_REDIRECT:http://localhost:3000/agenda}
    failure-redirect: ${CHRONOS_OAUTH_FAILURE_REDIRECT:http://localhost:3000/login?error=oauth}
    # When unset, the OAuth flow short-circuits to a deterministic
    # local-dev user so frontend work doesn't need a Google app.
    enabled: ${GOOGLE_CLIENT_ID:false}
  llm:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      model: ${CHRONOS_CLAUDE_MODEL:claude-opus-4-7}
      base-url: https://api.anthropic.com
      max-tokens: 1024
    ollama:
      base-url: ${CHRONOS_OLLAMA_URL:http://localhost:11434}
      model: ${CHRONOS_OLLAMA_MODEL:qwen2.5:3b}
    history-window: 12
